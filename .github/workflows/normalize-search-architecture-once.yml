          function page(i){const [slug,name,title,desc,h1,answer,queries,tasks,pitfalls,pids,links]=i,url=site+'solutions/'+slug+'/';const faqs=[[`${name} 작업 범위는 어디까지인가요?`,answer+' 실제 범위는 현재 시스템, 데이터, 외부 연동과 배포 조건을 확인한 뒤 확정합니다.'],[`기존 시스템이 있어도 ${name}이 가능한가요?`,'가능합니다. 기존 자산을 먼저 확인하고 유지할 부분과 변경할 부분을 나눠 불필요한 전면 재개발을 피합니다.'],[`${name}에서 먼저 확인할 것은 무엇인가요?`,`${tasks[0]}, ${tasks[1]}, ${tasks[2]} 항목을 먼저 확인하고 완료 기준과 실패·복구 조건까지 정합니다.`]];const schema={"@context":"https://schema.org","@graph":[{"@type":"Service","@id":url+'#service',"name":name,"serviceType":name,"url":url,"provider":org,"areaServed":{"@type":"Country","name":"South Korea"},"description":desc},{"@type":"FAQPage","mainEntity":faqs.map(([q,a])=>({"@type":"Question","name":q,"acceptedAnswer":{"@type":"Answer","text":a}}))},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"SuaveForge","item":site},{"@type":"ListItem","position":2,"name":"개발 외주 분야","item":site+'solutions/'},{"@type":"ListItem","position":3,"name":name,"item":url}]}]};return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><meta name="description" content="${esc(desc)}"><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1"><link rel="canonical" href="${url}"><meta property="og:type" content="website"><meta property="og:site_name" content="SuaveForge"><meta property="og:title" content="${esc(title)}"><meta property="og:description" content="${esc(desc)}"><meta property="og:url" content="${url}"><link rel="stylesheet" href="/services/service.css?v=20260904-01"><script type="application/ld+json">${JSON.stringify(schema)}</script><script defer src="/assets/runtime/pageview.js?v=${pv}"></script></head><body><header class="shell sitebar"><a class="brand" href="/">SuaveForge</a><nav><a href="/solutions/">개발 분야</a><a href="/work/">프로젝트</a><a href="/services/">서비스</a></nav></header><main><section class="shell hero"><p class="kicker">BUYER INTENT</p><h1>${esc(h1).replace(/\n/g,'<br>')}</h1><p class="lead">${esc(desc)}</p><p class="answer">${esc(answer)}</p><div class="chips" aria-label="관련 검색 표현">${queries.map(q=>`<span class="chip">${esc(q)}</span>`).join('')}</div></section><section class="shell section"><div class="section-head"><h2>${esc(name)}에서 실제로 맞춰야 할 것</h2><p>검색어만 바꾼 페이지가 아니라 실제 구현·운영 범위를 구분합니다.</p></div><div class="criteria">${tasks.map((x,n)=>`<article><h3>${['필요 기능','운영 연결','검증 기준'][n]}</h3><p>${esc(x)}</p></article>`).join('')}</div></section><section class="shell section"><div class="section-head"><h2>실패하기 쉬운 지점</h2></div><div class="criteria">${pitfalls.map(x=>`<article><h3>주의할 지점</h3><p>${esc(x)}</p></article>`).join('')}</div></section><section class="shell section"><div class="section-head"><h2>관련 구현 프로젝트</h2><p>현재 공개된 프로젝트 중 이 검색 의도와 직접 연결되는 사례입니다.</p></div><div class="project-grid">${pids.map(projectCard).join('')}</div></section><section class="shell section"><div class="section-head"><h2>연결되는 개발 범위</h2></div><div class="project-grid">${links.map(related).join('')}</div></section><section class="shell section"><div class="section-head"><h2>자주 묻는 질문</h2></div><div class="qa">${faqs.map(([q,a])=>`<article><h3>${esc(q)}</h3><p>${esc(a)}</p></article>`).join('')}</div></section><section class="shell cta"><h2>현재 화면·문서·코드·URL이 있다면<br>필요한 범위부터 나눌 수 있습니다.</h2><a href="mailto:project@suaveforge.com">${esc(name)} 문의 ↗</a></section></main></body></html>`}
          for(const i of intents){const d=path.join('solutions',i[0]);fs.mkdirSync(d,{recursive:true});fs.writeFileSync(path.join(d,'index.html'),page(i))}
          const core=[['flutter-app-development','Flutter 앱 개발 외주'],['admin-system-development','관리자 시스템 개발'],['api-integration-development','API 연동 개발'],['mvp-development','MVP 개발 외주'],['windows-automation-development','Windows 업무 자동화']];
          let hub=fs.readFileSync('solutions/index.html','utf8').replace(/<section data-search-intent-library>[\s\S]*?<\/section>/,'').replace(/<script data-search-intent-schema[\s\S]*?<\/script>/,'');
          hub=hub.replace(/<title>[^<]*<\/title>/,'<title>개발 외주 분야별 서비스 | 웹·앱·CRM·자동화·연동·유지보수 | SuaveForge</title>').replace(/<meta name="description" content="[^"]*">/,'<meta name="description" content="웹서비스, 앱, CRM, 예약, 관리자, API·Webhook, 자동화, 유지보수와 데이터 이전까지 세부 개발 외주 범위를 실제 프로젝트와 함께 확인합니다.">');
          const items=[...core.map(([slug,name])=>({slug,name,desc:'핵심 개발 범위와 실제 관련 프로젝트를 확인합니다.'})),...intents.map(i=>({slug:i[0],name:i[1],desc:i[3]}))];
          const library=`<section data-search-intent-library class="section"><div class="section-head"><h2>세부 개발 검색의도</h2><p>실제 의뢰 단위별로 범위와 사례를 연결했습니다.</p></div><div class="project-grid">${items.map(x=>`<a class="project" href="/solutions/${x.slug}/"><h3>${esc(x.name)}</h3><p>${esc(x.desc)}</p><span>상세 보기 ↗</span></a>`).join('')}</div></section>`;
          const listSchema={"@context":"https://schema.org","@type":"ItemList","name":"SuaveForge 세부 개발 외주 분야","itemListElement":items.map((x,n)=>({"@type":"ListItem","position":n+1,"name":x.name,"url":site+'solutions/'+x.slug+'/'}))};
          hub=hub.replace('</main>',library+'</main>').replace('</head>',`<script data-search-intent-schema type="application/ld+json">${JSON.stringify(listSchema)}</script></head>`).replace(/pageview\.js\?v=[0-9-]+/g,`pageview.js?v=${pv}`);fs.writeFileSync('solutions/index.html',hub);
          const serviceMap={'web-app-development':['web-service-development','crm-system-development','reservation-system-development','social-login-integration','cross-platform-app-development'],'lms-development':['survey-system-development','multi-branch-management-system','data-dashboard-development'],'automation-development':['windows-program-development','python-automation-program','excel-automation-program','pdf-document-automation','web-scraping-data-collection','image-processing-automation'],'software-rebuild':['existing-software-feature-addition','software-bugfix-maintenance','database-migration-integration']};
          for(const [s,slugs] of Object.entries(serviceMap)){const f=`services/${s}/index.html`;let h=fs.readFileSync(f,'utf8').replace(/<section data-intent-children>[\s\S]*?<\/section>/,'');const cards=slugs.map(slug=>{const i=info.get(slug);return `<a class="project" href="/solutions/${slug}/"><h3>${esc(i[1])}</h3><p>${esc(i[3])}</p><span>세부 범위 ↗</span></a>`}).join('');h=h.replace('</main>',`<section data-intent-children class="shell section"><div class="section-head"><h2>세부 의뢰 유형</h2><p>같은 서비스 안에서도 검색 목적과 구현 범위가 다른 작업을 분리했습니다.</p></div><div class="project-grid">${cards}</div></section></main>`).replace(/pageview\.js\?v=[0-9-]+/g,`pageview.js?v=${pv}`);fs.writeFileSync(f,h)}
          function upsert(file){let x=fs.readFileSync(file,'utf8');x=x.replace(/\s*<url>\s*<loc>https:\/\/suaveforge\.com\/(?:insights|cases|guides)\/[^<]*-reviewed\/<\/loc>[\s\S]*?<\/url>/g,'');for(const i of intents){const loc=site+'solutions/'+i[0]+'/',block=`<url><loc>${loc}</loc><lastmod>${stamp}</lastmod><changefreq>weekly</changefreq><priority>0.85</priority></url>`,safe=loc.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),re=new RegExp(`<url><loc>${safe}<\\/loc>[\\s\\S]*?<\\/url>`);x=re.test(x)?x.replace(re,block):x.replace('</urlset>',block+'\n</urlset>')}fs.writeFileSync(file,x)}
          upsert('sitemap.xml');upsert('sitemap-services.xml');
          function walk(d,out=[]){if(!fs.existsSync(d))return out;for(const e of fs.readdirSync(d,{withFileTypes:true})){if(['.git','node_modules'].includes(e.name))continue;const p=path.join(d,e.name);if(e.isDirectory())walk(p,out);else if(e.isFile()&&e.name==='index.html')out.push(p)}return out}
          for(const base of ['insights','cases','guides'])for(const f of walk(base)){if(!/-reviewed\/index\.html$/.test(f.replace(/\\/g,'/')))continue;const orig=f.replace(/-reviewed([/\\])index\.html$/,'$1index.html');if(!fs.existsSync(orig))continue;const canonical=site+orig.replace(/\\/g,'/').replace(/index\.html$/,'');let h=fs.readFileSync(f,'utf8').replace(/<meta name="robots" content="[^"]*">/i,'<meta name="robots" content="noindex,follow">').replace(/<link rel="canonical" href="[^"]*">/i,`<link rel="canonical" href="${canonical}">`).replace(/pageview\.js\?v=[0-9-]+/g,`pageview.js?v=${pv}`);fs.writeFileSync(f,h)}
          for(const f of walk('.')){let h=fs.readFileSync(f,'utf8'),n=h.replace(/pageview\.js\?v=[0-9-]+/g,`pageview.js?v=${pv}`);if(n!==h)fs.writeFileSync(f,n)}
          let css=fs.readFileSync('services/service.css','utf8');if(!css.includes('.chips{'))css=css.replace('.proof-strip{','.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.chip{display:inline-flex;align-items:center;min-height:36px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#4d535c;font-size:13px;font-weight:800}.proof-strip{');fs.writeFileSync('services/service.css',css);
          let llms=fs.readFileSync('llms.txt','utf8').replace(/\n## Buyer intent index[\s\S]*$/,'');llms+='\n\n## Buyer intent index\n'+items.map(x=>`- ${x.name}: ${site}solutions/${x.slug}/`).join('\n')+'\n';fs.writeFileSync('llms.txt',llms);
          console.log('SEARCH_INTENT_PAGES='+intents.length);console.log('SEARCH_INTENT_URLS_TOTAL='+items.length);
          NODE
      - name: Validate public output before commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(find solutions -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -ge 25
          grep -F 'data-search-intent-library' solutions/index.html
          grep -F 'web-service-development' sitemap-services.xml
          grep -F 'software-bugfix-maintenance' sitemap-services.xml
          grep -F 'data-intent-children' services/web-app-development/index.html
          grep -F 'data-intent-children' services/automation-development/index.html
          grep -F 'FAQPage' solutions/web-service-development/index.html
          grep -F '/work/gyeol/' solutions/web-service-development/index.html
          ! grep -R --include='*.html' -n 'pageview.js?v=202608' .
          ! grep -E '<loc>https://suaveforge.com/(insights|cases|guides)/[^<]*-reviewed/' sitemap.xml sitemap-services.xml
      - name: Commit normalized public site and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/normalize-search-architecture-once.yml
          git config user.name 'SuaveForge Search Architecture'
          git config user.email 'project@suaveforge.com'
          git add solutions services sitemap.xml sitemap-services.xml insights cases guides llms.txt .github/workflows/normalize-search-architecture-once.yml
          git commit -m 'Normalize public buyer-intent search architecture'
          git push origin HEAD:main
