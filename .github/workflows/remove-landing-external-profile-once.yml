name: Remove landing external profile once
on:
  push:
    paths:
      - '.github/workflows/remove-landing-external-profile-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove visible external profile from landing footer
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          target = '<p class="external-profile-proof">외부 프로필: <a href="https://kmong.com/@SUAVEFORGE" rel="me noopener" target="_blank">크몽 SUAVEFORGE ↗</a></p>'
          if target not in s:
              raise SystemExit('target footer profile link not found')
          p.write_text(s.replace(target, '', 1), encoding='utf-8')
      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/remove-landing-external-profile-once.yml
          git config user.name "SuaveForge Deploy"
          git config user.email "project@suaveforge.com"
          git add index.html .github/workflows/remove-landing-external-profile-once.yml
          git commit -m "Remove visible Kmong profile from landing footer"
          git push
