name: SEO repair 20260904

on:
  push:
    branches: [main]
    paths:
      - 'tools/seo-repair-20260904.mjs'
      - '.github/workflows/seo-repair-20260904.yml'

permissions:
  contents: write

concurrency:
  group: seo-repair-20260904-public
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply SEO repair
        run: node tools/seo-repair-20260904.mjs
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "SEO_REPAIR_COMMIT=not-needed"
            exit 0
          fi
          git config user.name "programmer119"
          git config user.email "53187583+programmer119@users.noreply.github.com"
          git add -A
          git commit -m "Repair crawlability tracking and content discovery"
          git pull --rebase
          git push
